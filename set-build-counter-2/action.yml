name: Update Build Counter
description: Update a JSON build counter that is stored in Actions Cache. Note that the parent job must limit concurrency to avoid race conditions.

inputs:
  seed:
    description: >
      The value to track uniqueness of builds. This is typically a combination of the branch and major.minor version
      of the project being built (for example, "release-1.0" from a release branch name).

      Defaults to the workflow ref, which makes the counter unique per branch and workflow file.
    required: false
    default: ${{ github.workflow_ref }}
  start-counter-at:
    description: >
      The value to start the counter at if it does not already exist. Defaults to 0.
    required: false
    default: '0'

outputs:
  count:
    description: >
      The updated build counter value.
    value: ${{ steps.counter.outputs.count }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Restore JSON Counter Cache
      uses: actions/cache@v4
      with:
        path: counters.json
        key: shared-build-counter-json-${{ github.run_id }}-${{ github.ref_name }}
        description: |-
            Cache the JSON build count for ${{ inputs.seed }} for future incrementing.
        save-always: true
        enableCrossOsArchive: true
        restore-keys: |
          shared-build-counter-json-${{ inputs.seed }}

    - name: Update Counter via Go Script
      id: counter
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p .cache
        exec 9>.cache/build-counter.lock
        flock -x 9

        cat <<'EOF' > counter.go
        package main

        import (
            "encoding/json"
            "fmt"
            "log"
            "os"
            "strconv"
        )

        func copyFile(src, dst string) error {
            data, err := os.ReadFile(src)
            if err != nil {
                return err
            }
            return os.WriteFile(dst, data, 0644)
        }

        func main() {
            counterBase := os.Getenv("INPUT_COUNTER_BASE")
            if counterBase == "" {
                counterBase = os.Getenv("GITHUB_REF_NAME")
            }
            if counterBase == "" {
                counterBase = "main"
            }

            startAt := 0
            if val, err := strconv.Atoi(os.Getenv("INPUT_START_COUNTER_AT")); err == nil {
                startAt = val
            }

            const dbFile = "counters.json"
            counters := make(map[string]int)

            if data, err := os.ReadFile(dbFile); err == nil {
                if err := json.Unmarshal(data, &counters); err != nil {
                    log.Fatalf("failed to parse json: %v", err)
                }
            }

            currentCount, exists := counters[counterBase]
            if !exists {
                currentCount = startAt
            } else {
                currentCount++
            }
            counters[counterBase] = currentCount

            tempFile, err := os.CreateTemp("", "counters-*.json")
            if err != nil {
                log.Fatalf("failed to create temp file: %v", err)
            }
            tempPath := tempFile.Name()
            defer os.Remove(tempPath)

            newData, err := json.MarshalIndent(counters, "", "  ")
            if err != nil {
                log.Fatalf("failed to marshal json: %v", err)
            }

            if _, err := tempFile.Write(newData); err != nil {
                tempFile.Close()
                log.Fatalf("failed to write json to temp file: %v", err)
            }
            if err := tempFile.Close(); err != nil {
                log.Fatalf("failed to close temp file: %v", err)
            }

            if err := os.Rename(tempPath, dbFile); err != nil {
                log.Printf("atomic rename failed, falling back to copy: %v", err)
                if copyErr := copyFile(tempPath, dbFile); copyErr != nil {
                    log.Fatalf("failed to replace db file via rename or copy: rename=%v copy=%v", err, copyErr)
                }
            }

            if githubOutput := os.Getenv("GITHUB_OUTPUT"); githubOutput != "" {
                if f, err := os.OpenFile(githubOutput, os.O_APPEND|os.O_WRONLY, 0644); err == nil {
                    defer f.Close()
                    fmt.Fprintf(f, "count=%d\n", currentCount)
                }
            }

            fmt.Printf("Counter base key: %s\n", counterBase)
            fmt.Printf("Start counter at: %d\n", startAt)
            fmt.Printf("Build number: %d\n", currentCount)
        }
        EOF

        go run counter.go
      env:
        INPUT_COUNTER_BASE: ${{ inputs.seed }}
        INPUT_START_COUNTER_AT: ${{ inputs.start-counter-at }}
