name: Update Build Counter
description: Update a JSON build counter that is stored in Actions Cache. Note that the parent job must limit concurrency to avoid race conditions.

inputs:
  seed:
    description: >
      The value to track uniqueness of builds. This is typically a combination of the branch and major.minor version
      of the project being built (for example, "release-1.0" from a release branch name).

      Defaults to the workflow ref, which makes the counter unique per branch and workflow file.
    required: false
    default: ${{ github.workflow_ref }}
  start-counter-at:
    description: >
      The value to start the counter at if it does not already exist. Defaults to 0.
    required: false
    default: '0'

outputs:
  count:
    description: >
      The updated build counter value.
    value: ${{ steps.counter.outputs.count }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.22'

    - name: Find previous build-counters artifact run
      id: find-artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        workflow_id=""
        if ! workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[] | select(.name == "${{ github.workflow }}") | .id' | head -n 1); then
          echo "run_id=" >> "$GITHUB_OUTPUT"
          echo "No workflow named '${{ github.workflow }}' was found; defaulting to start-counter-at."
          exit 0
        fi

        run_id=""
        while IFS= read -r candidate; do
          [ -n "$candidate" ] || continue
          [ "$candidate" = "${GITHUB_RUN_ID}" ] && continue

          artifact_exists=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" --jq '.artifacts[] | select(.name == "build-counters") | .name' | head -n 1 || true)
          if [ -n "$artifact_exists" ]; then
            run_id="$candidate"
            break
          fi
        done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=20" --jq '.workflow_runs[].id' || true)

        if [ -n "$run_id" ]; then
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Found build-counters artifact in workflow run ${run_id}."
        else
          echo "run_id=" >> "$GITHUB_OUTPUT"
          echo "No previous build-counters artifact found for this workflow; defaulting to start-counter-at."
        fi

    - name: Download previous build-counters artifact
      if: steps.find-artifact.outputs.run_id != ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: build-counters
        path: previous-build-counters
        github-token: ${{ github.token }}
        run-id: ${{ steps.find-artifact.outputs.run_id }}

    - name: Restore build-counters data
      shell: bash
      run: |
        set -euo pipefail

        rm -f counters.json
        if [ -f previous-build-counters/counters.json ]; then
          cp previous-build-counters/counters.json counters.json
        fi

    - name: Update Counter via Go Script
      id: counter
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p .cache
        exec 9>.cache/build-counter.lock
        flock -x 9

        cat <<'EOF' > counter.go
        package main

        import (
            "encoding/json"
            "fmt"
            "log"
            "os"
            "strconv"
        )

        func copyFile(src, dst string) error {
            data, err := os.ReadFile(src)
            if err != nil {
                return err
            }
            return os.WriteFile(dst, data, 0644)
        }

        func main() {
            counterBase := os.Getenv("INPUT_COUNTER_BASE")
            if counterBase == "" {
                counterBase = os.Getenv("GITHUB_REF_NAME")
            }
            if counterBase == "" {
                counterBase = "main"
            }

            startAt := 0
            if val, err := strconv.Atoi(os.Getenv("INPUT_START_COUNTER_AT")); err == nil {
                startAt = val
            }

            const dbFile = "counters.json"
            counters := make(map[string]int)

            if data, err := os.ReadFile(dbFile); err == nil {
                if err := json.Unmarshal(data, &counters); err != nil {
                    log.Fatalf("failed to parse json: %v", err)
                }
            }

            currentCount, exists := counters[counterBase]
            if !exists {
                currentCount = startAt
            } else {
                currentCount++
            }
            counters[counterBase] = currentCount

            tempFile, err := os.CreateTemp("", "counters-*.json")
            if err != nil {
                log.Fatalf("failed to create temp file: %v", err)
            }
            tempPath := tempFile.Name()
            defer os.Remove(tempPath)

            newData, err := json.MarshalIndent(counters, "", "  ")
            if err != nil {
                log.Fatalf("failed to marshal json: %v", err)
            }

            if _, err := tempFile.Write(newData); err != nil {
                tempFile.Close()
                log.Fatalf("failed to write json to temp file: %v", err)
            }
            if err := tempFile.Close(); err != nil {
                log.Fatalf("failed to close temp file: %v", err)
            }

            if err := os.Rename(tempPath, dbFile); err != nil {
                log.Printf("atomic rename failed, falling back to copy: %v", err)
                if copyErr := copyFile(tempPath, dbFile); copyErr != nil {
                    log.Fatalf("failed to replace db file via rename or copy: rename=%v copy=%v", err, copyErr)
                }
            }
            log.Printf("Updated counter for '%s' to %d and stored in %s", counterBase, currentCount, dbFile)

            if githubOutput := os.Getenv("GITHUB_OUTPUT"); githubOutput != "" {
                if f, err := os.OpenFile(githubOutput, os.O_APPEND|os.O_WRONLY, 0644); err == nil {
                    defer f.Close()
                    fmt.Fprintf(f, "count=%d\n", currentCount)
                }
            }

            fmt.Printf("Counter base key: %s\n", counterBase)
            fmt.Printf("Start counter at: %d\n", startAt)
            fmt.Printf("Build number: %d\n", currentCount)
        }
        EOF

        go run counter.go
      env:
        INPUT_COUNTER_BASE: ${{ inputs.seed }}
        INPUT_START_COUNTER_AT: ${{ inputs.start-counter-at }}

    - name: Upload build counters artifact
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with:
        name: build-counters
        path: counters.json
        if-no-files-found: error
        retention-days: 90
