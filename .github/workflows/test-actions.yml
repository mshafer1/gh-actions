on:
  pull_request:
    branches:
      - main
    paths:
      - set-build-counter/**
      - .github/workflows/test-actions.yml
  workflow_dispatch: 

env:
  REPO_MAJOR_MIN: '1.0'

jobs:
  build-counter-test-default:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./set-build-counter
        id: set-build-counter
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # default GITHUB_TOKEN has no permission to set repo variables
      - name: Use Output
        run: |
          echo "Build Counter Result: ${{ steps.set-build-counter.outputs.count }}"
  build-counter-test-with-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./set-build-counter
        id: set-build-counter
        with:
          seed: "${{ env.REPO_MAJOR_MIN }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # default GITHUB_TOKEN has no permission to set repo variables
      - name: Use Output
        run: |
          echo "Build Counter Result: ${{ steps.set-build-counter.outputs.count }}"
  build-counter-test-with-start-value:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./set-build-counter
        id: set-build-counter
        with:
          start-counter-at: '100'
          seed: '${{ env.REPO_MAJOR_MIN }}-start-at-100'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # default GITHUB_TOKEN has no permission to set repo variables
      - name: Use Output
        run: |
          echo "Build Counter Result: ${{ steps.set-build-counter.outputs.count }}"
