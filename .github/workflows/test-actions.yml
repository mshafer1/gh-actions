on:
  pull_request:
    branches:
      - main
    paths:
      - set-build-counter/**
      - .github/workflows/test-actions.yml
  workflow_dispatch: 

env:
  REPO_MAJOR_MIN: '1.0'

jobs:
  build-counter-test-default:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./set-build-counter
        id: set-build-counter
      - name: Use Output
        run: |
          echo "Build Counter Result: ${{ steps.set-build-counter.outputs.count }}"
  build-counter-test-with-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./set-build-counter
        id: set-build-counter
        with:
          seed: "${{ env.REPO_MAJOR_MIN }}"
      - name: Use Output
        run: |
          echo "Build Counter Result: ${{ steps.set-build-counter.outputs.count }}"
  build-counter-test-with-start-value:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./set-build-counter
        id: set-build-counter
        with:
          start-counter-at: '100'
          seed: '${{ env.REPO_MAJOR_MIN }}-start-at-100'
      - name: Use Output
        run: |
          echo "Build Counter Result: ${{ steps.set-build-counter.outputs.count }}"
