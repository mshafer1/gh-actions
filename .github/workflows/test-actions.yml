name: Build counter test workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - set-build-counter/**
      - .github/workflows/test-actions.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_MAJOR_MIN: '1.0'

permissions: {}

jobs:
  build-counter-test-default:
    name: Default build counter test
    runs-on: ubuntu-latest
    environment: build-counter
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./set-build-counter
        name: Set Build Counter
        id: set-build-counter
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # default GITHUB_TOKEN has no permission to set repo variables
      - name: Use Output
        run: |
          echo "Build Counter Result: $BUILD_COUNT"
        env:
          BUILD_COUNT: ${{ steps.set-build-counter.outputs.count }}
  build-counter-test-with-seed:
    name: Build counter test with seed
    runs-on: ubuntu-latest
    environment: build-counter
    permissions: {}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./set-build-counter
        id: set-build-counter
        with:
          seed: "${{ env.REPO_MAJOR_MIN }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # default GITHUB_TOKEN has no permission to set repo variables
      - name: Use Output
        run: |
          echo "Build Counter Result: $BUILD_COUNT"
        env:
          BUILD_COUNT: ${{ steps.set-build-counter.outputs.count }}
  build-counter-test-with-start-value:
    name: Build counter test with start value
    runs-on: ubuntu-latest
    environment: build-counter
    permissions: {}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./set-build-counter
        id: set-build-counter
        with:
          start-counter-at: '100'
          seed: '${{ env.REPO_MAJOR_MIN }}-start-at-100'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # default GITHUB_TOKEN has no permission to set repo variables
      - name: Use Output
        run: |
          echo "Build Counter Result: ${BUILD_COUNT}"
        env:
          BUILD_COUNT: ${{ steps.set-build-counter.outputs.count }}
  build-counter-2-with-start-value:
    name: Build counter test 2 with start value
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./set-build-counter-2
        id: set-build-counter
        with:
          start-counter-at: '200'
          seed: '${{ env.REPO_MAJOR_MIN }}-start-at-200'
      - name: Use Output
        run: |
          echo "Build Counter Result: ${BUILD_COUNT}"
        env:
          BUILD_COUNT: ${{ steps.set-build-counter.outputs.count }}
  build-counter-2-with-seed:
    name: Build counter test 2 with seed
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./set-build-counter-2
        id: set-build-counter
        with:
          seed: '${{ env.REPO_MAJOR_MIN }}-test-builder-counter-2-${{ github.ref_name }}'
      - name: Use Output
        run: |
          echo "Build Counter Result: ${BUILD_COUNT}"
        env:
          BUILD_COUNT: ${{ steps.set-build-counter.outputs.count }}
